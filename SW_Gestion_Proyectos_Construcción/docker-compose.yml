services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigc_user
      POSTGRES_PASSWORD: sigc_password
      POSTGRES_DB: sigc_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://sigc_user:sigc_password@db:5432/sigc_db?schema=public
      JWT_SECRET: change_this_secret
      JWT_EXPIRES_IN: 8h
      BCRYPT_SALT_ROUNDS: 10
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
